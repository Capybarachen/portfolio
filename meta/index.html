<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css" />
</head>

<body>

<h1>Meta</h1>

<p>
  This page includes stats about the code of this website.
  This visualization was created using D3.js.
</p>

<label id="time-filter">

  Show commits until:

  <input
    type="range"
    id="commit-progress"
    min="0"
    max="100"
    value="100"
  />

  <time id="commit-time-label"></time>

</label>

<div id="stats"></div>

<!-- ========================= -->
<!-- SCROLLYTELLING -->
<!-- ========================= -->

<section id="scrolly-1">

  <!-- LEFT SIDE -->
  <div id="scatter-story"></div>

  <!-- RIGHT SIDE -->
  <div id="scatter-plot">

    <h2>Commit activity by time of day</h2>

    <div id="chart"></div>

    <p id="selection-count">
      No commits selected
    </p>

    <dl
      id="language-breakdown"
      class="stats"
    ></dl>

  </div>

</section>

<!-- ========================= -->
<!-- CODEBASE EVOLUTION -->
<!-- ========================= -->

<section id="scrolly-2">

  <!-- LEFT -->
  <div id="files-section">

    <h2>Codebase evolution</h2>

    <dl id="files"></dl>

  </div>

  <!-- RIGHT -->
  <div id="files-story"></div>

</section>

<!-- ========================= -->
<!-- TOOLTIP -->
<!-- ========================= -->

<dl
  id="commit-tooltip"
  class="info tooltip"
  hidden
>

  <dt>Commit</dt>

  <dd>
    <a
      href=""
      id="commit-link"
      target="_blank"
    ></a>
  </dd>

  <dt>Date</dt>
  <dd id="commit-date"></dd>

  <dt>Time</dt>
  <dd id="commit-time"></dd>

  <dt>Author</dt>
  <dd id="commit-author"></dd>

  <dt>Lines</dt>
  <dd id="commit-lines"></dd>

</dl>

<script
  src="../global.js"
  type="module"
></script>

<script
  src="main.js"
  type="module"
></script>

</body>
</html>
